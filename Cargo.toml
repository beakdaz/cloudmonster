[workspace]
members = [
    "crates/core",
    "crates/net",
    "crates/app",
    "crates/cli",
    "crates/pma-gui",
    "apps/export-phpmyadmin-gui",
    "apps/export-adminer-gui",
    "apps/export-gitlab-gui",
    "apps/export-jenkins-gui",
    "apps/export-phppgadmin-gui",
    "apps/export-bitrix-gui",
    "apps/export-bitbucket-gui",
    "apps/export-jira-gui",
    "apps/export-redmine-gui",
    "apps/export-snowflake-gui",
    "apps/export-xwiki-gui",
    "apps/export-bamboo-gui",
    "apps/export-slack-gui",
    "apps/export-fortinet-gui",
    "apps/export-citrix-gui",
    "apps/export-mega-gui",
    "apps/export-zoho-gui",
    "apps/export-wps-gui",
    "apps/export-terabox-gui",
    "apps/export-owa-gui",
    "apps/export-kibana-gui",
    "apps/export-zabbix-gui",
    "apps/export-zimbra-gui",
    "apps/export-drupal-gui",
    "apps/export-grafana-gui",
    "apps/export-sonarqube-gui",
    "apps/export-mattermost-gui",
    "apps/export-adminpanel-gui",
    "apps/export-obsidian-gui",
    "apps/export-dynalist-gui",
    "apps/export-capacities-gui",
    "apps/export-gnotes-gui",
    "apps/export-joplin-gui",
    "apps/export-kortex-gui",
    "apps/export-mindlog-gui",
    "apps/export-notejoy-gui",
    "apps/export-notesnook-gui",
    "apps/export-standardnotes-gui",
    "apps/export-todoist-gui",
    "apps/export-turtl-gui",
    "apps/export-zotero-gui",
    "apps/crmcheck-gui",
    "apps/notecheck-gui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "rustls-tls", "gzip", "json", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
rayon = "1.10"
cached = { version = "0.54", features = ["async", "async_tokio_rt_multi_thread"] }
ghostwire = "1.1"
scraper = "0.23"
moka = { version = "0.12", default-features = false, features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
rand = "0.8"
chrono = "0.4"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
md-5 = "0.10"
base64 = "0.22"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
rsa = { version = "0.9", features = ["pem"] }
pbkdf2 = { version = "0.12", features = ["sha1", "sha2"] }
bcrypt = "0.16"
mega = { path = "third_party/mega-0.8", default-features = false, features = ["curl-impersonate"] }

pma-core = { path = "crates/core" }
pma-net = { path = "crates/net" }
pma-app = { path = "crates/app" }
eframe = "0.29"
egui = "0.29"
egui_extras = "0.29"
rfd = "0.15"
